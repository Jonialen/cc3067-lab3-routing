# Nine routers, one container each, on a private bridge network.
#
# Each node listens on port 5000 inside its own container and resolves its
# neighbours by service name, so there is no host port bookkeeping and the
# topology file is the only place adjacency is declared.
#
#   MODE=lsr docker compose up -d          bring the network up
#   docker attach lab3-node-a              open node A's console
#   docker compose stop node-f             simulate a router going down
#
# Detach from an attached console with Ctrl-P Ctrl-Q; Ctrl-C would stop the node.

x-node: &node
  build: .
  image: cc3067-lab3:latest
  networks: [lab3]
  # The node opens an interactive console on stdin, so the container needs a
  # TTY kept open even while nobody is attached.
  stdin_open: true
  tty: true

services:
  node-a:
    <<: *node
    container_name: lab3-node-a
    hostname: node-a
    command:
      - --id
      - "A"
      - --mode
      - ${MODE:-lsr}
      - --listen
      - 0.0.0.0:5000
      - --topo
      - configs/topo-default.json
      - --names
      - configs/names-docker.json

  node-b:
